<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ledger</title>
<style>
/* Inter, bundled (lib/fonts, SIL Open Font License - see lib/fonts/OFL.txt).
   It used to be fetched from Google Fonts on every launch: a request that
   told a third party each time the app was opened, and failed offline. The
   variable files cover every weight the app uses. The extended set loads
   only when a character needs it (accented names, some currency signs). */
@font-face {
  font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url("lib/fonts/inter-latin-wght-normal.woff2") format("woff2-variations"),
       url("lib/fonts/inter-latin-wght-normal.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
    U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url("lib/fonts/inter-latin-ext-wght-normal.woff2") format("woff2-variations"),
       url("lib/fonts/inter-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
    U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
    U+2C60-2C7F, U+A720-A7FF;
}

/* ── Ledger ───────────────────────────────────────────────────────────────
   The design system from Claude Design ("Ledger Forecast", 6.0). Every
   colour is a light-dark() pair and html[data-theme] sets color-scheme, so
   "system" follows Windows with no second set of rules. The names the
   screens have always used (--page, --ink, --line ...) are kept and pointed
   at Ledger's, so every screen - the hidden ones too - wears the same look
   in light and dark. */
:root {
  color-scheme: light dark;

  /* surfaces */
  --bg-window:        light-dark(#F5F5F7, #161618);
  --bg-card:          light-dark(#FFFFFF, #1F1F22);
  --bg-card-inset:    light-dark(#F5F5F7, #29292D);
  --bg-elevated:      light-dark(#FFFFFF, #2A2A2E);
  --bg-hover:         light-dark(rgba(0,0,0,.04), rgba(255,255,255,.06));
  --bg-pressed:       light-dark(rgba(0,0,0,.08), rgba(255,255,255,.10));
  --bg-selected-row:  light-dark(#EAF2FE, #1D2C44);
  --fill:             light-dark(rgba(118,118,128,.12), rgba(118,118,128,.24));
  --fill-2:           light-dark(rgba(118,118,128,.08), rgba(118,118,128,.18));
  --fill-hover:       light-dark(rgba(118,118,128,.18), rgba(118,118,128,.32));
  --segment-thumb:    light-dark(#FFFFFF, #636366);
  --scrim:            light-dark(rgba(0,0,0,.28), rgba(0,0,0,.56));

  /* materials */
  --material-mica:    light-dark(rgba(238,238,242,.82), rgba(30,30,34,.82));
  --material-mica-fallback: light-dark(#EDEDF1, #1E1E22);
  --material-popover: light-dark(rgba(252,252,253,.86), rgba(44,44,48,.86));
  --material-bar:     light-dark(rgba(245,245,247,.78), rgba(22,22,24,.78));

  /* separators */
  --separator:        light-dark(rgba(60,60,67,.14), rgba(84,84,88,.42));
  --separator-strong: light-dark(rgba(60,60,67,.29), rgba(84,84,88,.65));

  /* text - all at least 4.5:1 on the card and the window */
  --text-1: light-dark(#1D1D1F, #F5F5F7);
  --text-2: light-dark(#56565B, #AEAEB2);
  --text-3: light-dark(#6B6B70, #98989D);
  --text-on-accent: #FFFFFF;

  /* accent and meaning */
  --accent:           #0071E3;
  --accent-hover:     light-dark(#0062C4, #1A7FEA);
  --accent-pressed:   light-dark(#0055AA, #0066CC);
  --accent-text:      light-dark(#0066CC, #4DA3FF);
  --accent-tint:      light-dark(#EAF2FE, #172A45);
  --focus-ring:       light-dark(#0071E3, #4DA3FF);
  --positive:         light-dark(#1E7B34, #30D158);
  --negative:         light-dark(#D70015, #FF6961);
  --warning:          light-dark(#A05A00, #FFB340);
  --warning-tint:     light-dark(#FFF4E0, #3A2A10);
  --badge:            #D70015;

  /* series */
  --series-net:       light-dark(#007AFF, #0A84FF);
  --series-fees:      light-dark(#FF9500, #FF9F0A);
  --series-ads:       light-dark(#AF52DE, #BF5AF2);
  --series-after:     light-dark(#28A745, #30D158);
  --series-left:      light-dark(#34C759, #30D158);
  --fee-fba:          light-dark(#FF9500, #FF9F0A);
  --fee-referral:     light-dark(#FF2D55, #FF375F);
  --fee-storage:      light-dark(#30B0C7, #40C8E0);
  --fee-aged:         light-dark(#A2845E, #AC8E68);
  --fee-closing:      light-dark(#5856D6, #5E5CE6);
  --fee-peritem:      light-dark(#32ADE6, #64D2FF);
  --fee-returns:      light-dark(#FFCC00, #FFD60A);
  --fee-spare-1:      light-dark(#8E8E93, #98989D);
  --fee-spare-2:      light-dark(#00C7BE, #63E6E2);
  --fee-spare-3:      light-dark(#FF3B30, #FF453A);
  --fee-spare-4:      light-dark(#5AC8FA, #70D7FF);
  --hatch:            light-dark(rgba(60,60,67,.22), rgba(235,235,245,.20));
  --grid:             light-dark(rgba(60,60,67,.10), rgba(235,235,245,.10));

  /* shape */
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-2xl: 22px; --r-pill: 999px;
  --shadow-card:    light-dark(0 0 0 .5px rgba(0,0,0,.05), 0 0 0 .5px rgba(255,255,255,.06)), 0 1px 2px rgba(0,0,0,.04);
  --shadow-thumb:   0 0 0 .5px rgba(0,0,0,.04), 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
  --shadow-popover: 0 0 0 .5px light-dark(rgba(0,0,0,.08), rgba(255,255,255,.10)), 0 10px 32px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.06);
  --shadow-sheet:   0 0 0 .5px light-dark(rgba(0,0,0,.08), rgba(255,255,255,.10)), 0 24px 72px rgba(0,0,0,.28);

  /* type */
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --lg-t-large-title: 700 30px/36px var(--font);
  --lg-t-title-1: 700 24px/30px var(--font);
  --lg-t-title-2: 650 20px/26px var(--font);
  --lg-t-title-3: 600 17px/22px var(--font);
  --lg-t-headline: 600 14px/20px var(--font);
  --lg-t-body: 400 14px/20px var(--font);
  --lg-t-callout: 400 13px/18px var(--font);
  --lg-t-footnote: 400 12px/16px var(--font);
  --lg-t-caption: 500 11px/14px var(--font);
  --lg-t-hero: 650 28px/34px var(--font);

  /* motion */
  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 320ms;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --ease-spring: cubic-bezier(.34, 1.36, .64, 1);

  /* the names the screens were written with, pointed at Ledger's */
  --page:        var(--bg-window);
  --surface:     var(--bg-card);
  --surface-alt: light-dark(#FAFAFC, #242427);
  --surface-sunk:var(--bg-card-inset);
  --ink:         var(--text-1);
  --ink-2:       var(--text-2);
  --ink-3:       var(--text-3);
  --ink-num:     var(--text-2);
  --accent-ink:  #FFFFFF;
  --accent-soft: var(--accent-tint);
  --accent-line: light-dark(#B6D4FA, #24477A);
  --line:        var(--separator);
  --line-soft:   light-dark(rgba(60,60,67,.08), rgba(84,84,88,.30));
  --line-2:      var(--separator-strong);
  --edge:        var(--separator);
  --warn:        var(--warning);
  --warn-bg:     var(--warning-tint);
  --warn-line:   light-dark(#F3D7A6, #5A4318);
  --warn-dot:    light-dark(#E08A00, #FFB340);
  --error:       var(--negative);
  --error-bg:    light-dark(#FDECEE, #3A1A1C);
  --error-line:  light-dark(#F7C4CA, #5C2A2E);
  --ok:          var(--positive);
  --ok-bg:       light-dark(#E8F6EC, #173222);
  --dot-ok:      var(--positive);
  --dot-neutral: var(--text-3);
  --mark-1:      var(--series-net);
  --mark-1-soft: light-dark(#DCEBFF, #16304F);
  --mark-2:      var(--series-fees);
  --mark-2-soft: light-dark(#FFEBCC, #3A2A10);
  --mark-3:      var(--series-ads);
  --mark-4:      var(--series-after);
  --mark-grid:   var(--grid);
  --mark-neutral:light-dark(#AEAEB2, #636366);
  --claude:      #D97757;
  --claude-bg:   var(--bg-elevated);
  --claude-line: var(--separator);
  --r-card: var(--r-xl); --r-banner: var(--r-lg); --r-nav: var(--r-md); --r-ctl: var(--r-md); --r-chip: var(--r-pill);
  --shadow: var(--shadow-card); --shadow-primary: var(--shadow-card); --shadow-lift: var(--shadow-popover);
  --sans: var(--font);

  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;
  --gap: 20px;
  --pad-x: 32px;
  --t-hero: 28px; --t-date: 22px; --t-stat: 24px; --t-h1: 22px; --t-h2: 17px; --t-h3: 15px;
  --t-body: 14px; --t-label: 13px; --t-meta: 13px; --t-tag: 12px; --lh-body: 1.45;

  /* Room for Windows' own minimise / maximise / close, drawn over the top
     right of the window (titleBarOverlay). Zero in a browser. */
  --cap-r: clamp(16px, calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 12px), 200px);
  --cap-h: env(titlebar-area-height, 0px);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg-window); color: var(--text-1); font-family: var(--font);
       font-size: var(--t-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased;
       font-feature-settings: "cv11", "ss01"; }
h1,h2,h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; color: var(--text-1); }
p { margin: 0 0 var(--s1); }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: default; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }
kbd { font: 500 11px/16px var(--font); color: var(--text-3); padding: 0 5px; border-radius: var(--r-xs);
      box-shadow: inset 0 0 0 .5px var(--separator-strong); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: light-dark(rgba(0,0,0,.22), rgba(255,255,255,.22)); border-radius: 10px;
                            border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: light-dark(rgba(0,0,0,.34), rgba(255,255,255,.34));
                                  border: 2px solid transparent; background-clip: padding-box; }
@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.fig, .num, .money { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.num { text-align: right; white-space: nowrap; }
.is-neg { color: var(--negative); }
.is-pos { color: var(--positive); }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── shell ─────────────────────────────────────────────────────────────── */
#shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
#side { display: none; }
#main { min-width: 0; padding-bottom: 96px; }
.wrap { padding: 0 var(--s2); }
#view { container-type: inline-size; container-name: view; }

/* ── icons ─────────────────────────────────────────────────────────────── */
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 15px; height: 15px; stroke-width: 1.75; }
.ic-lg { width: 24px; height: 24px; }

/* ── toolbar and large title ───────────────────────────────────────────── */
/* The toolbar stays; the big title scrolls away under it, and its name
   appears small in the toolbar once it has. It is also where the window is
   dragged from, the title bar being hidden. */
#top { position: sticky; top: 0; z-index: 30; min-height: 52px; display: flex; align-items: center;
       padding: 8px var(--cap-r) 8px var(--s2); border-bottom: .5px solid transparent;
       -webkit-app-region: drag; app-region: drag;
       transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
#top.is-compact { background: var(--material-mica-fallback); background: var(--material-bar);
                  backdrop-filter: blur(20px) saturate(180%); border-bottom-color: var(--separator); }
#top .inner { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
#top .tb-title { font: 600 15px/20px var(--font); letter-spacing: -.15px; opacity: 0; min-width: 0;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 transition: opacity var(--dur) var(--ease); }
#top.is-compact .tb-title { opacity: 1; }
#top .spacer { flex: 1; }
#top .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
#top .controls > *, #top button, #top select, #top input, #top label, #top a { -webkit-app-region: no-drag; app-region: no-drag; }
#top .controls .lbl { margin: 0; display: inline; font: 500 12px/16px var(--font); color: var(--text-2); }
#top .controls select { width: auto; }
.hctl { display: inline-flex; align-items: center; gap: 8px; }
.large-title { padding: 2px var(--s2) 18px; display: flex; flex-direction: column; gap: 4px; }
.large-title h1 { margin: 0; font: var(--lg-t-large-title); letter-spacing: -0.6px; }
.large-title p { margin: 0; font: var(--lg-t-body); color: var(--text-2); max-width: 80ch; text-wrap: pretty; }
.large-title .asof { display: none; }
@media (max-width: 560px) { .large-title h1 { font-size: 24px; line-height: 30px; } }

/* The balance, and how old it is, where the eye already is. */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
        border-radius: var(--r-pill); font: 500 12.5px/16px var(--font); white-space: nowrap;
        background: var(--fill-2); color: var(--text-2); }
.pill.is-ok   { background: var(--ok-bg); color: var(--positive); }
.pill.is-warn { background: var(--warning-tint); color: var(--warning); }
button.pill { border: 0; }

/* ── mobile nav ────────────────────────────────────────────────────────── */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex;
          background: var(--material-mica-fallback); background: var(--material-bar);
          backdrop-filter: blur(20px) saturate(180%); border-top: .5px solid var(--separator);
          padding-bottom: env(safe-area-inset-bottom); overflow-x: auto; scrollbar-width: none; }
#tabbar::-webkit-scrollbar { display: none; }
#tabbar button { flex: 1 0 auto; min-width: 62px; background: none; border: 0; color: var(--text-2);
                 padding: 10px 8px 8px; font: 500 11.5px/14px var(--font);
                 display: flex; flex-direction: column; align-items: center; gap: 4px; white-space: nowrap; }
#tabbar button[aria-current="page"] { color: var(--accent-text); }

/* ── cards ─────────────────────────────────────────────────────────────── */
.card { background: var(--bg-card); border: 0; border-radius: var(--r-xl); box-shadow: var(--shadow-card);
        padding: 20px 24px; margin-bottom: var(--gap); min-width: 0; }
.card.is-primary { box-shadow: var(--shadow-card); }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h h2 { font: var(--lg-t-title-3); letter-spacing: -0.2px; }
.card-h h3 { font: var(--lg-t-headline); }
.card-h .ic { color: var(--text-3); }
.card-h .tag { margin-left: auto; flex: none; }
.card-h.nowrap { flex-wrap: nowrap; align-items: flex-start; }
.card-h.nowrap h2 { min-width: 0; }
.card .sub { color: var(--text-2); font: var(--lg-t-callout); margin-bottom: var(--s2); max-width: 76ch; }
.card__header { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.card__titles { display: flex; flex-direction: column; gap: 2px; flex: 1 1 280px; min-width: 0; }
.card__title { margin: 0; font: var(--lg-t-title-3); letter-spacing: -0.2px; text-wrap: pretty; }
.card__subtitle { margin: 0; font: var(--lg-t-callout); color: var(--text-2); }
.card__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.section-title { margin: 32px 0 12px; font: var(--lg-t-title-2); letter-spacing: -0.3px; display: flex;
                 align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section-title small { font: var(--lg-t-body); color: var(--text-2); letter-spacing: 0; }
.divider { height: .5px; background: var(--separator); border: 0; margin: 16px 0; flex: none; }
.grid { display: grid; gap: var(--gap); margin-bottom: var(--gap); }
.grid > .card, .grid > .tile { margin-bottom: 0; }
.grid > * { container-type: inline-size; min-width: 0; }
@container view (min-width: 720px) { .g2 { grid-template-columns: 1fr 1fr; } }
@container view (min-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } }
@container view (min-width: 780px) { .g3 { grid-template-columns: repeat(3, 1fr); } }
@container view (min-width: 940px) { .g4 { grid-template-columns: repeat(4, 1fr); } }
@container view (min-width: 900px) { .g-main { grid-template-columns: minmax(0,2fr) minmax(0,1fr); } }
@container view (min-width: 900px) { .g-lead { grid-template-columns: 4fr 3fr 3fr; } }

/* ── tiles ─────────────────────────────────────────────────────────────── */
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; background: var(--bg-card);
        border: 0; border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 14px 16px 16px;
        min-width: 0; text-align: left; color: var(--text-1);
        transition: box-shadow var(--dur) var(--ease), transform var(--dur-fast) var(--ease); }
.tile .tile-l, .tile .stat-l { font: 600 13px/18px var(--font); color: var(--text-2); margin-bottom: 2px; }
.tile .tile-v { font: var(--lg-t-hero); letter-spacing: -0.7px; }
.tile .tile-m { font: var(--lg-t-footnote); color: var(--text-2); margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: var(--gap); }
@container view (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container view (max-width: 460px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
button.tile { font: inherit; width: 100%; }
button.tile:hover { box-shadow: var(--shadow-card), 0 4px 14px rgba(0,0,0,.06); }
button.tile:active { transform: scale(.985); }
button.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--c); }
.tile__head { display: flex; align-items: center; gap: 7px; font: 600 13px/18px var(--font); min-height: 18px; }
.tile__label { flex: 1; min-width: 0; }
.tile__toggle { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px/14px var(--font);
                color: var(--text-3); white-space: nowrap; }
.tile__toggle-mark { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
                     box-shadow: inset 0 0 0 1.25px var(--separator-strong); color: transparent; }
.tile__toggle-mark .ic { width: 10px; height: 10px; stroke-width: 2.5; }
.tile[aria-pressed="true"] .tile__toggle { color: var(--text-2); }
.tile[aria-pressed="true"] .tile__toggle-mark { background: var(--c); box-shadow: none; color: #fff; }
.tile__value { font: var(--lg-t-hero); letter-spacing: -0.7px; font-variant-numeric: tabular-nums;
               margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile__foot { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; font: var(--lg-t-footnote);
              color: var(--text-2); text-wrap: pretty; }
@container view (max-width: 1080px) {
  .tile__value { font-size: 24px; line-height: 30px; letter-spacing: -0.5px; }
  .tile__toggle-text { display: none; }
}
.cur { font-weight: 500; color: var(--text-2); margin-right: 2px; letter-spacing: 0; font-size: .7em; }
.neg .cur, .is-neg .cur { color: inherit; }
.cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--text-3));
        display: inline-block; }

/* ── toolbar strip ─────────────────────────────────────────────────────── */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
           background: var(--bg-card); border-radius: var(--r-xl); box-shadow: var(--shadow-card);
           padding: 12px 20px; margin-bottom: var(--gap); }
.toolbar .tb-l { font-weight: 600; }
.toolbar .tb-r { margin-left: auto; color: var(--text-2); font-size: var(--t-label); }
.toolbar input[type=date] { width: auto; font-weight: 600; }

/* ── chips and segmented controls ──────────────────────────────────────── */
.chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px;
        border: 0; border-radius: var(--r-pill); background: none; box-shadow: inset 0 0 0 1px var(--separator-strong);
        color: var(--text-2); font: 500 12.5px/16px var(--font); white-space: nowrap;
        transition: background var(--dur-fast) var(--ease); }
.chip:hover { background: var(--bg-hover); color: var(--text-1); }
.chip[aria-pressed="true"] { background: var(--fill); box-shadow: none; color: var(--text-1); }
.chip:disabled { opacity: .4; }
.chip .cdot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip[aria-pressed="true"] .cdot { background: var(--c); }
.segmented, .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: var(--fill);
                   flex-wrap: wrap; }
.segmented button, .seg button { position: relative; height: 26px; min-height: 0; padding: 0 12px; border: 0; border-radius: 7px;
                  background: none; color: var(--text-1); font: 500 13px/18px var(--font); white-space: nowrap;
                  transition: background var(--dur) var(--ease); }
.segmented button:hover, .seg button:hover { background: var(--bg-hover); }
.segmented button[aria-pressed="true"], .segmented button[aria-checked="true"],
.seg button[aria-pressed="true"], .seg button[aria-current="true"] {
  background: var(--segment-thumb); box-shadow: var(--shadow-thumb); font-weight: 600; color: var(--text-1); }
.segmented button:disabled { opacity: .4; }

/* ── figures ───────────────────────────────────────────────────────────── */
.hero { font: 650 34px/40px var(--font); letter-spacing: -1px; color: var(--text-1); }
.bigdate { font: 600 22px/28px var(--font); letter-spacing: -.3px; }
@media (max-width: 560px) { .hero { font-size: 28px; line-height: 34px; } }
.stat-v { font: 650 24px/30px var(--font); letter-spacing: -.5px; }
.stat-v .cur { font-size: 14px; }
.stat-l { font: 600 13px/18px var(--font); color: var(--text-2); display: flex; align-items: center; gap: 7px;
          margin-bottom: 6px; }
.stat-l .ic { color: var(--text-3); }
.neg { color: var(--negative); }

/* Unavailable is a state, never a number. */
.na { display: inline-flex; align-items: flex-start; gap: 6px; background: var(--warning-tint);
      border-radius: var(--r-md); padding: 8px 10px; color: var(--warning); font: 500 13px/18px var(--font);
      max-width: 46ch; }
.na .ic { color: var(--warning); margin-top: 0; }
.na b { display: block; font-weight: 600; }
.na span { font-weight: 400; }
.na-sm { padding: 5px 9px; font-size: 12px; }

/* where a figure comes from */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
       border-radius: var(--r-sm); background: var(--fill-2); color: var(--text-2); border: 0;
       font: 600 11px/14px var(--font); letter-spacing: .1px; white-space: nowrap; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--text-3); }
.tag.is-actual, .tag.is-current, .tag.is-ok { background: var(--ok-bg); color: var(--positive); }
.tag.is-actual::before, .tag.is-current::before, .tag.is-ok::before { background: var(--positive); }
.tag.is-forecast, .tag.is-warn { background: var(--warning-tint); color: var(--warning); }
.tag.is-forecast::before, .tag.is-warn::before { background: var(--warn-dot); }
.tag.is-assumed { background: var(--fill-2); color: var(--text-2); }
.tag.is-error { background: var(--error-bg); color: var(--negative); }
.tag.is-error::before { background: var(--negative); }
.tag.nodot::before { display: none; }
.tag > .ic { display: none; }
.tag[title] { cursor: help; }
.source-tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 6px;
              border-radius: var(--r-sm); background: var(--fill-2); color: var(--text-2);
              font: 600 11px/14px var(--font); letter-spacing: .1px; white-space: nowrap; }
.source-tag .ic { width: 12px; height: 12px; stroke-width: 1.75; }
.source-tag--exact { background: var(--accent-tint); color: var(--accent-text); }
.meta { font: var(--lg-t-callout); color: var(--text-2); }

/* ── notices ───────────────────────────────────────────────────────────── */
.note { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 4px 10px; align-items: start;
        padding: 12px 14px; border-radius: var(--r-lg); background: var(--bg-card-inset);
        font: var(--lg-t-callout); color: var(--text-1); margin: 12px 0; border: 0; text-wrap: pretty; }
.note > .ic { width: 18px; height: 18px; color: var(--text-2); margin-top: 0; }
.note.is-warn  { background: var(--warning-tint); }
.note.is-warn > .ic { color: var(--warning); }
.note.is-error { background: var(--error-bg); }
.note.is-error > .ic { color: var(--negative); }
.note.is-ok    { background: var(--ok-bg); }
.note.is-ok > .ic { color: var(--positive); }
.note b { font-weight: 600; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { margin: 3px 0; }
.note .note__action { align-self: center; }
#view > .note, .banner { margin: 0 0 var(--gap); align-items: center; }
.banner > div { flex: 1 1 auto; }
.banner .btn { margin-left: auto; }

/* ── tables ────────────────────────────────────────────────────────────── */
.tscroll { overflow-x: auto; margin: 0 -24px; padding: 0 24px; max-height: 620px; overflow-y: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font: var(--lg-t-callout);
        font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; white-space: nowrap; border-bottom: .5px solid var(--separator); }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--bg-card); font: 500 12px/16px var(--font);
           color: var(--text-2); padding-top: 8px; padding-bottom: 8px; }
tbody tr:hover td { background: var(--bg-hover); }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.group td { font-weight: 600; background: var(--bg-card) !important; }
tr.child td:first-child { padding-left: 24px; color: var(--text-2); font-weight: 400; }
tr.sum td { font-weight: 650; border-top: .5px solid var(--separator-strong); border-bottom: 0; }
td.wrap, th.wrap { white-space: normal; min-width: 240px; }
td.act, th.act { position: sticky; right: 0; background: var(--bg-card); text-align: right; }
tbody tr:hover td.act { background: var(--bg-card); }
.expander { background: none; border: 0; padding: 0 6px 0 0; color: var(--text-3);
            display: inline-flex; align-items: center; vertical-align: middle; }
.expander .ic { transition: transform .15s ease; }
.expander[aria-expanded="true"] .ic { transform: rotate(90deg); }

/* a table drawn as a grid of rows (the forecast's tables) */
.grid-table { display: flex; flex-direction: column; font: var(--lg-t-callout); font-variant-numeric: tabular-nums; }
.grid-table__row { display: grid; grid-template-columns: var(--cols); column-gap: 16px; align-items: center;
                   padding: 10px 8px; margin: 0 -8px; border-bottom: .5px solid var(--separator); }
.grid-table__row:hover { background: var(--bg-hover); }
.grid-table__row--head { font: 500 12px/16px var(--font); color: var(--text-2); padding-top: 6px; padding-bottom: 8px; }
.grid-table__row--head:hover { background: none; }
.grid-table__row:last-child { border-bottom: 0; }
.grid-table__row.is-total { font-weight: 650; }
.grid-table__row.is-subtotal { font-weight: 600; background: var(--fill-2); border-radius: var(--r-sm); }
.grid-table .num { text-align: right; white-space: nowrap; }
.grid-scroll { overflow-x: auto; margin: 0 -24px; padding: 0 24px; }
.grid-scroll > .grid-table { min-width: 860px; }
.cell-stack { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cell-stack b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-stack small { font: var(--lg-t-footnote); color: var(--text-3); }
.cell-with-dot { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.cell-with-dot > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inline-bar { position: relative; height: 6px; border-radius: 3px; background: var(--fill-2); min-width: 60px; }
.inline-bar__fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c); }

/* ── banners under the toolbar: updates, the morning download, Supabase ── */
#updatebar:empty { display: none; }
#updatebar { display: flex; flex-direction: column; gap: 8px; padding: 0 var(--s2); margin: 0 0 12px; }
.updbar { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 10px 12px 10px 14px;
          border-radius: var(--r-lg); background: var(--accent-tint); color: var(--text-1);
          font: var(--lg-t-callout); box-shadow: var(--shadow-card); }
.updbar > .ic { color: var(--accent-text); }
.updbar.is-working { background: var(--bg-card); }
.updbar.is-warn { background: var(--warning-tint); }
.updbar.is-warn > .ic { color: var(--warning); }
.updbar b { font-weight: 600; }
.updbar .grow { flex: 1 1 auto; min-width: 200px; }
.updbar .btn { margin: 0; }
.updbar .progress { flex: 1 0 100%; }
.updbar .upd-pct { font-variant-numeric: tabular-nums; color: var(--text-2); }
.progress { width: 100%; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.progress__fill { height: 100%; background: var(--accent); border-radius: 2px;
                  transition: width var(--dur-slow) var(--ease); }
.progress--indeterminate .progress__fill { width: 30%; animation: ledger-indet 1.4s var(--ease) infinite; }
@keyframes ledger-indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@keyframes ledger-spin { to { transform: rotate(360deg); } }
.spin { animation: ledger-spin 900ms linear infinite; }
/* the one-time Supabase setup, shown whole so it can be checked before running */
.sqlbox { white-space: pre-wrap; font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
  background: var(--bg-card-inset); padding: 12px; border-radius: var(--r-md); overflow: auto; max-height: 220px;
  margin: 0; user-select: text; }

/* Installing an update: said, with the app's own face, before the window goes. */
.inst-scrim { position: fixed; inset: 0; z-index: 90; background: var(--scrim); display: grid; place-items: center; }
.inst-sheet { width: min(400px, calc(100vw - 32px)); background: var(--bg-elevated); border-radius: var(--r-2xl);
              box-shadow: var(--shadow-sheet); padding: 28px 28px 24px; display: flex; flex-direction: column;
              align-items: center; text-align: center; gap: 10px; }
.inst-sheet h2 { font: var(--lg-t-title-2); letter-spacing: -.3px; margin-top: 6px; }
.inst-sheet p { margin: 0; font: var(--lg-t-callout); color: var(--text-2); text-wrap: pretty; }
.inst-sheet .progress { margin-top: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .inst-sheet { animation: sheetin var(--dur-slow) var(--ease-spring); }
}
@keyframes sheetin { from { opacity: 0; transform: translateY(8px) scale(.98); } }

/* ── reporting range ───────────────────────────────────────────────────── */
#rangebar:empty { display: none; }
.rangebar { background: var(--bg-card); border-radius: var(--r-xl); box-shadow: var(--shadow-card);
            padding: 12px 20px; margin-bottom: var(--gap); }
.rangebar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.rangebar-l { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
.range-seg { flex-wrap: wrap; }
.rangebar-d { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rangebar-d .lbl { margin: 0; white-space: nowrap; }
.rangebar-d input[type=date] { width: auto; }
.datebasis { margin: var(--s2) 0 0; padding: 0; background: none; border: 0; display: flex; gap: 8px;
             align-items: flex-start; color: var(--text-3); font: var(--lg-t-callout); }
.datebasis .ic { margin-top: 1px; }
.datebasis b { color: var(--text-2); font-weight: 600; }

/* ── readiness checklist ───────────────────────────────────────────────── */
.checklist { display: grid; gap: 0; margin-top: 8px; }
.ck { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center;
      padding: 12px 0; border-bottom: .5px solid var(--separator); }
.ck:last-child { border-bottom: 0; }
.ck-i { color: var(--warning); display: flex; }
.ck .meta { margin-top: 2px; }
.ck-a { text-align: right; }
@container (max-width: 520px) {
  .ck { grid-template-columns: auto minmax(0,1fr); }
  .ck-a { grid-column: 2; text-align: left; }
}

/* ── bridge list ───────────────────────────────────────────────────────── */
.bridge { list-style: none; margin: 0; padding: 0; }
.bridge li { display: flex; gap: var(--s2); padding: 9px 0; border-bottom: .5px solid var(--separator);
             align-items: baseline; }
.bridge li .l { flex: 1; color: var(--text-2); }
.bridge li .v { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.bridge li.total { border-bottom: 0; border-top: .5px solid var(--separator-strong); margin-top: 4px; }
.bridge li.total .l, .bridge li.total .v { color: var(--text-1); font-weight: 650; font-size: 16px; }
.bridge li.ctx { border-bottom: 0; color: var(--text-3); font-size: var(--t-meta); }

/* ── controls ──────────────────────────────────────────────────────────── */
label.lbl, .field__label { display: block; font: 500 12px/16px var(--font); color: var(--text-2); margin-bottom: 6px; }
input[type=date], input[type=text], input[type=number], input[type=password], input[type=url],
select, textarea {
  font: var(--lg-t-body); color: var(--text-1); background: var(--bg-card); border: 0;
  box-shadow: inset 0 0 0 1px var(--separator-strong); border-radius: var(--r-md); padding: 0 10px; min-height: 32px;
  width: 100%; font-variant-numeric: tabular-nums;
  transition: box-shadow var(--dur-fast) var(--ease); }
textarea { padding: 8px 10px; }
select { padding: 0 6px; }
input:hover, select:hover, textarea:hover { box-shadow: inset 0 0 0 1px var(--text-3); }
input:focus, select:focus, textarea:focus { outline: none;
  box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px light-dark(rgba(0,113,227,.22), rgba(77,163,255,.3)); }
input[type=range] { accent-color: var(--accent); }
.field { margin-bottom: var(--s2); min-width: 0; }
.frow { display: grid; gap: var(--s2); }
@media (min-width: 640px) { .frow.f2 { grid-template-columns: 1fr 1fr; }
                            .frow.f3 { grid-template-columns: repeat(3,1fr); }
                            .frow.f4 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .frow.f4 { grid-template-columns: repeat(4,1fr); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px;
       background: var(--accent); color: var(--text-on-accent); border: 0; border-radius: var(--r-pill);
       padding: 0 16px; font: 600 13px/18px var(--font); white-space: nowrap; text-decoration: none;
       transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur-fast); }
.btn .ic { width: 15px; height: 15px; stroke-width: 1.75; }
.btn:hover { background: var(--accent-hover); text-decoration: none; }
.btn:active { background: var(--accent-pressed); transform: scale(.98); }
.btn.sec { background: var(--fill); color: var(--text-1); }
.btn.sec:hover { background: var(--fill-hover); }
.btn.sec:active { background: light-dark(rgba(118,118,128,.26), rgba(118,118,128,.4)); }
.btn.tint { background: var(--accent-tint); color: var(--accent-text); }
.btn.tint:hover { background: light-dark(#DCEAFD, #1C3354); }
.btn.plain { background: none; color: var(--accent-text); padding: 0 8px; }
.btn.plain:hover { background: var(--bg-hover); }
.btn.warn { background: var(--warning-tint); color: var(--warning); }
.btn.warn:hover { background: light-dark(#FDEBCB, #4A3614); }
.btn.danger { background: var(--negative); color: #fff; }
.btn.danger:hover { background: light-dark(#B80012, #FF7F78); }
.btn.sm { height: 26px; padding: 0 12px; font: 600 12px/16px var(--font); }
.btn.sm .ic { width: 13px; height: 13px; }
.btn.lg { height: 44px; padding: 0 24px; border-radius: var(--r-lg); font: 600 15px/20px var(--font); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btnrow { display: flex; gap: var(--s1); flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-text); font: inherit; }
.linkbtn:hover { text-decoration: underline; }
.icon-button { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px;
               border-radius: var(--r-md); border: 0; background: none; color: var(--text-2); padding: 0;
               transition: background var(--dur-fast) var(--ease); }
.icon-button .ic { width: 18px; height: 18px; }
.icon-button:hover { background: var(--bg-hover); color: var(--text-1); }
.icon-button:active { background: var(--bg-pressed); }
.icon-button:disabled { opacity: .35; pointer-events: none; }
.icon-button--sm { width: 26px; height: 26px; border-radius: var(--r-sm); }
.icon-button--sm .ic { width: 15px; height: 15px; }
.subtabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: var(--s2); border-bottom: .5px solid var(--separator); }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-2);
                  min-height: 34px; padding: 0 12px; font: 500 13px/18px var(--font);
                  display: inline-flex; align-items: center; gap: 6px; margin-bottom: -1px; }
.subtabs button:hover { color: var(--text-1); }
.subtabs button[aria-current="true"] { color: var(--text-1); font-weight: 600; border-bottom-color: var(--accent); }
.subtabs .count { font-weight: 600; color: var(--text-1); }
.tabcard { padding: 8px 20px 22px; }
.tabcard > .subtabs { margin: 0 -20px 18px; padding: 0 20px; }
.tabcard .card { border: 0; border-radius: 0; box-shadow: none; padding: 0; margin: 0 0 22px; background: none; }
.tabcard .card + .card { border-top: .5px solid var(--separator); padding-top: 20px; }
.tabcard .tscroll { margin: 0 -20px; padding: 0 20px; }
.nested .body > .card, .nested .body > section.card { border: 0; border-radius: 0; box-shadow: none;
  padding: 0; margin: 0 0 22px; background: none; }
.nested .body > .card + .card { border-top: .5px solid var(--separator); padding-top: 20px; }

details { border: 0; border-radius: var(--r-lg); padding: 10px 12px; margin: var(--s1) 0; background: var(--bg-card-inset); }
details.card { padding: 0; background: var(--bg-card); }
details.card > summary { padding: 12px 16px; color: var(--text-1); }
details.card[open] > summary { border-bottom: .5px solid var(--separator); margin-bottom: 0; }
details.card > .body { padding: 16px 24px 22px; }
details.plain { border: 0; padding: 0; background: none; margin: 12px 0 0; }
details.plain > summary { color: var(--accent-text); }
.legend-d { margin-top: var(--s2); }
.legend-d .dl dt { display: flex; align-items: center; }
summary { font: 500 13px/18px var(--font); color: var(--text-1); display: flex; align-items: center; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary .ic { color: var(--text-3); }
details[open] > summary { margin-bottom: 10px; }

.dl { display: grid; grid-template-columns: 1fr; gap: 4px; align-items: baseline; margin: 0; }
.dl dt { padding-top: 8px; }
.dl dd { padding-bottom: 8px; border-bottom: .5px solid var(--separator); }
.dl dd:last-child { border-bottom: 0; }
@container (min-width: 220px) {
  .dl { grid-template-columns: minmax(0,1fr) minmax(0,auto); gap: 0 var(--s2); }
  .dl dt { padding: 8px 0; border-bottom: .5px solid var(--separator); }
  .dl dd { padding: 8px 0; border-bottom: .5px solid var(--separator); }
  .dl dt:last-of-type, .dl dd:last-child { border-bottom: 0; }
}
.dl dt { color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.dl dt .ic { color: var(--text-3); }
.dl dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; }
.dl dd .na { text-align: left; min-width: 0; max-width: 100%; }

.empty { text-align: center; padding: var(--s5) var(--s2); color: var(--text-2); }
.empty .ic { color: var(--text-3); width: 32px; height: 32px; margin-bottom: 10px; stroke-width: 1.25; }
.empty h3 { font: var(--lg-t-title-3); margin-bottom: 6px; }
.empty p { max-width: 48ch; margin: 0 auto var(--s2); }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
               padding: 64px 24px 56px; }
.empty-state__icon { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
                     background: var(--accent-tint); color: var(--accent-text); margin-bottom: 6px; }
.empty-state__icon .ic { width: 32px; height: 32px; stroke-width: 1.25; }
.empty-state h2 { margin: 0; font: var(--lg-t-title-1); letter-spacing: -0.45px; }
.empty-state p { margin: 0; max-width: 440px; color: var(--text-2); text-wrap: pretty; }
.empty-state .btn { margin-top: 8px; }
.empty-state__aside { margin-top: 8px; font: var(--lg-t-callout); color: var(--text-3); }

/* ── drop zone ─────────────────────────────────────────────────────────── */
#drop { border: 1.5px dashed var(--separator-strong); border-radius: var(--r-lg); padding: 28px 24px;
        text-align: center; color: var(--text-2); background: none; font: var(--lg-t-callout);
        transition: border-color var(--dur-fast), background var(--dur-fast); }
#drop.over { border-color: var(--accent); background: var(--accent-tint); }
#drop .ic { color: var(--accent-text); width: 28px; height: 28px; stroke-width: 1.25; }
#drop h3 { font: var(--lg-t-headline); color: var(--text-1); margin: var(--s1) 0 6px; }
.bar { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

/* ── charts ────────────────────────────────────────────────────────────── */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.ch-axis { font-size: 11.5px; font-weight: 500; fill: var(--text-3); }
.ch-val  { font-size: 12.5px; fill: var(--text-1); font-weight: 600; }
.ch-grid { stroke: var(--grid); stroke-width: 1; }
.ch-base { stroke: var(--separator-strong); stroke-width: 1; }
.ch-bar { transition: opacity .15s ease; }
.ch-bar:hover { opacity: .78; }
.ch-gap { font-size: 11px; font-weight: 600; fill: var(--text-2); paint-order: stroke; stroke: var(--bg-card);
          stroke-width: 4px; stroke-linejoin: round; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font: var(--lg-t-footnote); color: var(--text-2);
          margin-top: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.key.solid { background: var(--mark-1); }
.key.fc { background: var(--mark-1-soft); border: 1px dashed var(--mark-1); }
.key.neg { background: var(--mark-2); }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.swatch--line { width: 16px; height: 0; border-radius: 0; background: none; border-top: 2px solid var(--c); }
.swatch--dashed { border-top-style: dashed; }
.swatch--hatch { background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 4px);
                 box-shadow: inset 0 0 0 .5px var(--separator-strong); }
.swatch--marker { width: 0; height: 12px; border-radius: 0; background: none; border-left: 1.5px dashed var(--text-2); }

/* The forecast chart, and the reading that follows the pointer. */
.fchart { position: relative; border-radius: var(--r-md); }
.fchart:focus-visible { outline-offset: 6px; }
.fchart svg { cursor: crosshair; user-select: none; -webkit-user-select: none; }
.ch-lab { font-size: 12px; font-weight: 600; fill: var(--text-1); paint-order: stroke; stroke: var(--bg-card);
          stroke-width: 4px; stroke-linejoin: round; }
.ch-labv { fill: var(--text-2); font-weight: 500; }
.fc-brush { fill: light-dark(rgba(0,113,227,.10), rgba(77,163,255,.16)); stroke: var(--accent); stroke-width: 1; }
.fc-guide { stroke: var(--text-2); }
.fc-dot { stroke: var(--bg-card); stroke-width: 2; }
.fc-tip { position: absolute; top: 0; left: 0; z-index: 25; pointer-events: none; width: max-content;
          max-width: min(440px, 90vw); background: var(--material-popover);
          backdrop-filter: blur(30px) saturate(180%); border-radius: var(--r-lg); box-shadow: var(--shadow-popover);
          padding: 10px 12px 12px; color: var(--text-1); font: var(--lg-t-footnote); }
.fc-tip[hidden] { display: none; }
.fc-tip .fc-h { font: 600 13px/18px var(--font); margin-bottom: 6px; }
.fc-tip .fc-g { display: grid; column-gap: 16px; row-gap: 5px; align-items: center; font-variant-numeric: tabular-nums; }
.fc-tip .fc-g .h { font: 500 11px/14px var(--font); color: var(--text-3); text-align: right; }
.fc-tip .fc-g .nm { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; color: var(--text-2); }
.fc-tip .fc-g .nm i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.fc-tip .fc-g .v { text-align: right; white-space: nowrap; }
.fc-tip .fc-g .neg { color: var(--negative); }
.fc-tip .fc-g .on { font-weight: 600; color: var(--text-1); }
.fc-tip .fc-n { margin-top: 8px; padding-top: 6px; border-top: .5px solid var(--separator); color: var(--text-2);
                max-width: 360px; white-space: normal; }
.tipzone { position: relative; }
.sp-seg { transition: opacity .12s ease; }
.sp-seg:hover { opacity: .8; }
.sp-row { fill: transparent; }
.sp-row:hover { fill: var(--bg-hover); }
.sp-row.on { fill: var(--bg-selected-row); }
[data-sku] { cursor: pointer; }
/* one hundred per cent of net sales, split into what takes it */
.stacked-bar { position: relative; display: flex; height: 28px; border-radius: var(--r-sm); overflow: hidden; gap: 2px; }
.stacked-bar__seg { background: var(--c); min-width: 2px; transition: filter var(--dur-fast), opacity var(--dur-fast); }
.stacked-bar:hover .stacked-bar__seg { opacity: .55; }
.stacked-bar .stacked-bar__seg:hover { opacity: 1; filter: brightness(1.06); }
.stacked-bar-labels { display: flex; gap: 2px; margin-top: 8px; font: var(--lg-t-footnote); font-variant-numeric: tabular-nums; }
.stacked-bar-labels span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-2); }
.stacked-bar-labels b { display: block; font-weight: 600; color: var(--text-1); }
/* each product: its costs laid along its own net sales */
.product-list { display: flex; flex-direction: column; }
.product-row { display: grid; grid-template-columns: 168px minmax(0,1fr) 150px; gap: 16px; align-items: center;
               padding: 10px 12px; margin: 0 -12px; border-radius: var(--r-md); border: 0; background: none;
               text-align: left; color: var(--text-1); width: calc(100% + 24px); font: inherit;
               transition: background var(--dur-fast); }
.product-row:hover { background: var(--bg-hover); }
.product-row[aria-selected="true"] { background: var(--bg-selected-row); }
.product-row__id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.product-row__id b { font: 600 13px/18px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.product-row__id small { font: var(--lg-t-footnote); color: var(--text-3); font-variant-numeric: tabular-nums; }
.product-row__track { position: relative; height: 18px; }
.product-row__bar { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 1px; border-radius: 4px; overflow: hidden; }
.product-row__bar span { background: var(--c); min-width: 1px; }
.product-row__marker { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px dashed var(--text-2); }
.product-row__none { font: var(--lg-t-footnote); color: var(--text-3); line-height: 18px; }
.product-row__nums { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font: var(--lg-t-footnote);
                     font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.product-row__nums b { font: 600 13px/18px var(--font); color: var(--text-1); }
.product-row__nums b.is-neg { color: var(--negative); }
@container view (max-width: 820px) { .product-row { grid-template-columns: 120px minmax(0,1fr) 116px; gap: 10px; } }
/* the forecast's dates */
.date-bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 16px 20px; align-items: end; }
.date-bar .field { margin: 0; }
.date-bar__quick { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.date-bar__quick .field__label { margin: 0; }
@container view (max-width: 640px) { .date-bar { grid-template-columns: 1fr 1fr; } }
.scrollrow { display: flex; align-items: center; gap: 12px; margin: 16px 0 0; font: var(--lg-t-footnote); color: var(--text-3); }
.scrollrow input[type=range] { flex: 1; min-width: 0; min-height: 0; box-shadow: none; padding: 0; background: none; }
.date-meta { display: flex; gap: 6px; flex-wrap: wrap; font: var(--lg-t-callout); color: var(--text-2); margin-top: 14px;
             font-variant-numeric: tabular-nums; }
.date-meta b { color: var(--text-1); font-weight: 600; }
/* zooming */
.zoom-row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: 0 0 8px;
            font: var(--lg-t-footnote); color: var(--text-3); }
.zoom-row__hint { flex: 1; min-width: 200px; }
.zoom-row__state { flex: 1; min-width: 200px; color: var(--text-1); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.zoom-row__state .ic { color: var(--accent-text); width: 14px; height: 14px; }
.zoom-row__buttons { display: flex; gap: 2px; align-items: center; }
.zoom-row__sep { width: .5px; height: 16px; background: var(--separator-strong); margin: 0 4px; }
/* the lines of a fees-over-time chart, each a switch */
.serchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.overtime { margin-top: 4px; }
.skupick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
.skupick select { max-width: 560px; flex: 1 1 320px; }
.skupick .field__label { margin: 0; }

/* More tools in the sidebar */
.navsub { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; }
.navsubgroup { font: 600 11px/14px var(--font); letter-spacing: .1px; color: var(--text-3); padding: 8px 10px 4px; }

/* Settings: grouped rows, each a switch */
.setrow { display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 10px 0;
          border-top: .5px solid var(--separator); }
.card-h + .sub + .setrow, .card-h + .setrow { border-top: 0; }
.setrow > span { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.setrow > span > b { font: 500 14px/20px var(--font); }
.setrow .meta { font: var(--lg-t-footnote); }
.switch { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: var(--r-pill);
          margin: 0; border: 0; padding: 0; flex: none; position: relative;
          background: light-dark(rgba(120,120,128,.24), rgba(120,120,128,.40));
          transition: background var(--dur) var(--ease); }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
                 background: #fff; box-shadow: var(--shadow-thumb); transition: transform var(--dur) var(--ease-spring); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(16px); }
.switch:disabled { opacity: .4; }

/* The guide: the rest of the screen dimmed, the part it is about left clear */
.tour-block { position: fixed; inset: 0; z-index: 1000; }
.tour-hole { position: fixed; z-index: 1001; border-radius: var(--r-lg); pointer-events: none;
             box-shadow: 0 0 0 4px light-dark(rgba(255,255,255,.9), rgba(77,163,255,.6)), 0 0 0 9999px var(--scrim);
             transition: top .2s ease, left .2s ease, width .2s ease, height .2s ease; }
.tour-hole.is-none { top: 50%; left: 50%; width: 0; height: 0; box-shadow: 0 0 0 9999px var(--scrim); }
.tour-card { position: fixed; z-index: 1002; width: min(360px, calc(100vw - 24px)); background: var(--bg-elevated);
             border-radius: var(--r-xl); box-shadow: var(--shadow-sheet); padding: 16px 18px 14px; }
.tour-k { font: 600 11.5px/14px var(--font); color: var(--accent-text); letter-spacing: .1px; margin-bottom: 6px; }
.tour-card h3 { font: var(--lg-t-title-3); letter-spacing: -.2px; margin-bottom: 6px; }
.tour-card p { color: var(--text-2); font: var(--lg-t-callout); margin: 0 0 12px; }
.tour-card .tour-miss { display: flex; gap: 8px; align-items: flex-start; font: var(--lg-t-footnote);
                        background: var(--bg-card-inset); border-radius: var(--r-md); padding: 8px 10px; }
.tour-dots { display: flex; gap: 5px; margin: 4px 0 14px; flex-wrap: wrap; }
.tour-dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--separator-strong); }
.tour-dots i.on { width: 16px; background: var(--accent); }
.tour-foot { display: flex; align-items: center; gap: 6px; }
.tour-foot .grow { flex: 1; }
.tour-link { background: none; border: 0; padding: 0; color: var(--text-3); font: var(--lg-t-footnote);
             text-decoration: underline; }
.tour-link:hover { color: var(--text-1); }

/* ── sidebar ───────────────────────────────────────────────────────────── */
.app-icon { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center;
            background: linear-gradient(180deg, #2B8CFF, #0066D6);
            box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,60,140,.25); }
.app-icon svg { width: 18px; height: 18px; }
.app-icon--lg { width: 56px; height: 56px; border-radius: 13px; }
.app-icon--lg svg { width: 36px; height: 36px; }
.wordmark { font: 700 17px/22px var(--font); letter-spacing: -0.35px; }
.navgroup { font: 600 11px/14px var(--font); letter-spacing: .1px; color: var(--text-3); padding: 14px 10px 6px; }
.navgroup:first-child { padding-top: 2px; }
.navbadge { margin-left: auto; font: 500 12px/16px var(--font); color: var(--text-3); flex: none;
            font-variant-numeric: tabular-nums; }
#side nav button span:not(.navbadge) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Where the figures come from, and how fresh they are, always in view. */
.datastatus { display: flex; flex-direction: column; gap: 6px; width: 100%; margin: 0 0 6px; padding: 12px;
              border: 0; border-radius: var(--r-lg); background: var(--bg-card); box-shadow: var(--shadow-card);
              text-align: left; color: var(--text-1); font: var(--lg-t-footnote);
              transition: box-shadow var(--dur) var(--ease); }
.datastatus:hover { box-shadow: var(--shadow-card), 0 4px 14px rgba(0,0,0,.06); }
.datastatus .ds-t { font: 600 12px/16px var(--font); color: var(--text-2); }
.datastatus .ds-r { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; align-items: center; gap: 8px;
                    color: var(--text-2); }
.datastatus .ds-r b { font-weight: 500; color: var(--text-1); font-variant-numeric: tabular-nums;
                      white-space: nowrap; text-align: right; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); display: inline-block; }
.dot.is-ok { background: var(--positive); }
.dot.is-warn { background: var(--warning); }

/* ── Ask Claude ────────────────────────────────────────────────────────── */
#askbtn { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px;
          background: none; border: 0; border-radius: var(--r-md); color: var(--text-1);
          font: 500 13px/18px var(--font); }
#askbtn:hover { background: var(--bg-hover); }
#askbtn .star { color: var(--claude); width: 17px; height: 17px; flex: none; }
#askbtn kbd { margin-left: auto; }
#ask { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 60;
       background: var(--bg-elevated); border-left: .5px solid var(--separator);
       box-shadow: -12px 0 40px rgba(0,0,0,.10); display: flex; flex-direction: column;
       transform: translateX(100%); transition: transform var(--dur-slow) var(--ease); }
#ask[data-open="true"] { transform: translateX(0); }
#ask header { display: flex; align-items: center; gap: 10px; padding: calc(var(--cap-h) + 12px) 12px 12px 18px;
              border-bottom: .5px solid var(--separator); }
#ask header h2 { font: var(--lg-t-headline); flex: 1; }
#ask header .star { color: var(--claude); width: 18px; height: 18px; }
#ask .body { flex: 1; overflow-y: auto; padding: 12px 18px 16px; }
#ask .foot { border-top: .5px solid var(--separator); padding: 12px 14px 14px; }
.suggest { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.suggest button { text-align: left; background: var(--bg-card-inset); border: 0; border-radius: var(--r-lg);
                  padding: 10px 12px; font: var(--lg-t-callout); color: var(--text-1);
                  transition: background var(--dur-fast); }
.suggest button:hover { background: var(--fill); }
.turn { margin-bottom: var(--s2); font: var(--lg-t-callout); }
.turn.you { margin-left: auto; max-width: 88%; width: fit-content; background: var(--accent); color: #fff;
            border-radius: 18px 18px 6px 18px; padding: 9px 13px; }
.turn.claude { white-space: pre-wrap; background: var(--bg-card-inset); border-radius: 18px 18px 18px 6px;
               padding: 9px 13px; max-width: 94%; }
.turn.claude .who { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12px;
                    color: var(--claude); margin-bottom: 4px; }
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 55; }

/* ── notifications ─────────────────────────────────────────────────────── */
.bellbtn { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0;
           border: 0; border-radius: var(--r-md); background: none; color: var(--text-2);
           transition: background var(--dur-fast) var(--ease); }
.bellbtn:hover { background: var(--bg-hover); color: var(--text-1); }
.bellbtn[aria-expanded="true"] { background: var(--fill); color: var(--text-1); }
.bellbadge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px;
             border-radius: var(--r-pill); background: var(--badge); color: #fff; font: 700 10px/16px var(--font);
             text-align: center; box-shadow: 0 0 0 2px var(--bg-window); font-variant-numeric: tabular-nums; }
.bellbadge.is-quiet { background: var(--accent); }
#noticeslot:empty { display: none; }
.notice-scrim { position: fixed; inset: 0; z-index: 60; }
.notice-panel { position: fixed; z-index: 61; top: 56px; right: 24px; width: min(380px, calc(100vw - 32px));
                max-height: calc(100vh - 90px); display: flex; flex-direction: column; padding: 6px;
                background: var(--material-popover); backdrop-filter: blur(30px) saturate(180%);
                border-radius: var(--r-lg); box-shadow: var(--shadow-popover); }
.notice-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 10px; }
.notice-head h2 { font: var(--lg-t-headline); margin: 0 auto 0 0; }
.notice-list { overflow-y: auto; padding: 0 0 4px; }
.notice-item { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); }
.notice-item:hover { background: var(--bg-hover); }
.notice-item.is-new { background: var(--accent-tint); }
.notice-item .ic { margin-top: 1px; }
.notice-item.k-ok .ic { color: var(--positive); }
.notice-item.k-warn .ic { color: var(--warning); }
.notice-item.k-error .ic { color: var(--negative); }
.notice-item.k-info .ic { color: var(--text-3); }
.notice-title { font: 600 13px/18px var(--font); }
.notice-detail { color: var(--text-2); font: var(--lg-t-footnote); margin-top: 2px; }
.notice-when { color: var(--text-3); font: var(--lg-t-footnote); margin-top: 4px; }
.notice-item details { margin-top: 6px; font: var(--lg-t-footnote); }
.notice-item details summary { color: var(--accent-text); font: var(--lg-t-footnote); }
.notice-item dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; }
.notice-item dt { color: var(--text-3); }
.notice-item dd { margin: 0; }
.notice-empty { padding: 22px 16px; color: var(--text-3); text-align: center; font: var(--lg-t-callout); }
#toastslot { position: fixed; z-index: 80; right: 24px; bottom: 24px; display: grid; gap: 8px;
             width: min(400px, calc(100vw - 32px)); }
.toast { display: grid; grid-template-columns: 22px 1fr 22px; gap: 10px; align-items: start;
         padding: 10px 12px; border-radius: var(--r-lg); background: var(--material-popover);
         backdrop-filter: blur(30px) saturate(180%); box-shadow: var(--shadow-popover); font: 500 13px/18px var(--font); }
.toast.k-ok .ic:first-child { color: var(--positive); }
.toast.k-error .ic:first-child { color: var(--negative); }
.toast.k-warn .ic:first-child { color: var(--warning); }
.toast.k-info .ic:first-child { color: var(--text-3); }
.toast .x { background: none; border: 0; padding: 0; color: var(--text-3); }
@media (prefers-reduced-motion: no-preference) {
  .toast, .notice-panel { animation: modalfade .16s ease-out; }
}
@keyframes modalfade { from { opacity: 0; transform: translateY(6px); } }

/* ── setup window ──────────────────────────────────────────────────────── */
#setupmodal:empty { display: none; }
.modal-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 70; }
.modal { position: fixed; z-index: 71; left: 50%; top: 50%; transform: translate(-50%, -50%);
         width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto;
         background: var(--bg-elevated); border-radius: var(--r-2xl); padding: 24px;
         box-shadow: var(--shadow-sheet); }
.modal h2 { font: var(--lg-t-title-2); letter-spacing: -.3px; }
.modal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.modal input { margin-bottom: 0; }
@media (prefers-reduced-motion: no-preference) {
  .modal { animation: modalin var(--dur-slow) var(--ease-spring); }
}
@keyframes modalin { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)) scale(.98); } }

/* ── desktop ───────────────────────────────────────────────────────────── */
@media (min-width: 1000px) {
  #shell { grid-template-columns: 248px 1fr; }
  #side { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 10px;
          background: var(--material-mica-fallback); background: var(--material-mica);
          backdrop-filter: blur(20px) saturate(180%); border-right: .5px solid var(--separator);
          position: sticky; top: 0; height: 100vh; }
  #side .brand { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 8px; margin-bottom: 4px;
                 -webkit-app-region: drag; app-region: drag; }
  #side nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; padding: 0 0 12px; }
