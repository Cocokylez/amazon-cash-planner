<title>Amazon Cash Planner</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── palette ──────────────────────────────────────────────────────────────
   Redesign v3. Every value below was measured off the rendered mockup rather
   than estimated from a screenshot - see design/v3-layout-map.md.

   The ink ramp is darker than it was: #344158 for secondary text is 9.9:1 on
   white (the old #48546B was 7.6:1), and #56637A for tertiary is 6.1:1. Both
   comfortably clear AA; nothing that carries meaning uses anything lighter.

   Chart marks keep teal #0D9488 rather than the UI accent #0F766E: the accent
   sits just below the chroma floor for a data mark and reads grey against the
   surface. Same hue family, one step brighter. */
:root {
  --page:        #F6F7F9;
  --surface:     #FFFFFF;
  --surface-alt: #FAFBFC;
  --surface-sunk:#F1F3F6;
  --ink:         #172B4D;
  --ink-2:       #344158;
  --ink-3:       #56637A;
  --ink-num:     #46546C;   /* currency prefixes beside a figure */
  --accent:      #0F766E;
  --accent-hover:#0B5F58;
  --accent-ink:  #FFFFFF;
  --accent-soft: #F3FAF8;
  --accent-line: #B7DDD6;
  --line:        #E2E8F0;
  --line-soft:   #EEF1F5;
  --line-2:      #D3DAE3;   /* control borders */
  --edge:        #E4E8EE;   /* sidebar and header edges */
  --warn:        #92400E;
  --warn-bg:     #FFFBEB;
  --warn-line:   #FDE68A;
  --warn-dot:    #D97706;
  --error:       #B91C1C;
  --error-bg:    #FEF2F2;
  --error-line:  #FECACA;
  --ok:          #0F766E;
  --ok-bg:       #F3FAF8;
  --dot-ok:      #0D9488;
  --dot-neutral: #AEB8C5;

  /* data marks - validated as a categorical pair */
  --mark-1:      #0D9488;
  --mark-1-soft: #CCFBF1;
  --mark-2:      #B45309;
  --mark-2-soft: #FEF3C7;
  --mark-grid:   #EDF1F6;
  --mark-neutral:#94A3B8;

  /* Claude assistant panel */
  --claude:      #D97757;
  --claude-bg:   #FDF8F4;
  --claude-line: #F0DDD1;

  --r-card: 12px;
  --r-banner: 10px;
  --r-nav: 7px;
  --r-ctl: 6px;
  --r-chip: 5px;
  --shadow: none;
  --shadow-primary: 0 1px 2px rgba(15,118,110,.06);
  --shadow-lift: 0 2px 4px rgba(23,43,77,.06), 0 8px 24px rgba(23,43,77,.08);
  --sans: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;

  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;
  --gap: 20px;              /* between cards */
  --pad-x: 28px;            /* content and header side padding */

  /* Type scale. Body and table text stay at 16px so the app is comfortable at
     100% zoom; nothing that carries meaning goes below 14px. */
  --t-hero:  40px;
  --t-date:  28px;
  --t-stat:  26px;
  --t-h1:    22px;
  --t-h2:    18px;
  --t-h3:    17px;
  --t-body:  16px;
  --t-label: 15px;
  --t-meta:  15px;
  --t-tag:   14px;
  --lh-body: 1.5;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans);
       font-size: var(--t-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased;
       font-feature-settings: "cv05" 1, "cv11" 1; }
h1,h2,h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
p { margin: 0 0 var(--s1); }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
kbd { font: inherit; font-size: var(--t-tag); color: var(--ink-3); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #CDD4DD; border-radius: 10px; border: 2px solid transparent;
                            background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #AEB8C5; border: 2px solid transparent;
                                  background-clip: padding-box; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── shell ─────────────────────────────────────────────────────────────── */
#shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
#side { display: none; }
#main { min-width: 0; padding-bottom: 96px; }
.wrap { padding: 0 var(--s2); }
#view { container-type: inline-size; container-name: view; }

/* ── icons ─────────────────────────────────────────────────────────────── */
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
      stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; stroke-width: 2; }
.ic-lg { width: 24px; height: 24px; }

/* ── header ────────────────────────────────────────────────────────────── */
/* Sticky, so the page's name and its controls stay in reach however far down
   a long screen somebody has read. */
#top { position: sticky; top: 0; z-index: 30; background: var(--surface);
       border-bottom: 1px solid var(--edge); padding: 10px var(--s2); margin-bottom: var(--s3); }
#top .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
#top .titles { min-width: 0; flex: 1 1 320px; }
#top h1 { font-size: var(--t-h1); line-height: 1.5; letter-spacing: -.01em; }
#top #pageblurb { display: block; font-size: var(--t-label); color: var(--ink-2); line-height: 1.5;
                  margin: 0; max-width: 72ch; }
#top .asof { display: none; }
#top .spacer { display: none; }
#top .controls { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
#top .controls .lbl { margin: 0; display: inline; font-size: var(--t-label); color: var(--ink-2);
                      font-weight: 400; }
#top .controls select { width: auto; }
.hctl { display: inline-flex; align-items: center; gap: 8px; }

/* The balance, and how old it is, where the eye already is. */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 9px;
        border-radius: var(--r-ctl); font-size: var(--t-label); white-space: nowrap;
        background: var(--surface-sunk); color: var(--ink-2); }
.pill.is-ok   { background: var(--ok-bg); color: var(--accent); }
.pill.is-warn { background: var(--warn-bg); color: var(--warn); }
button.pill { border: 0; cursor: pointer; }

/* ── mobile nav ────────────────────────────────────────────────────────── */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex;
          background: var(--surface); border-top: 1px solid var(--edge);
          padding-bottom: env(safe-area-inset-bottom);
          overflow-x: auto; scrollbar-width: none; }
#tabbar::-webkit-scrollbar { display: none; }
#tabbar button { flex: 1 0 auto; min-width: 62px; background: none; border: 0; color: var(--ink-2);
                 padding: 10px 8px 8px; font-size: 12.5px; font-weight: 500; cursor: pointer;
                 display: flex; flex-direction: column; align-items: center; gap: 4px;
                 white-space: nowrap; }
#tabbar button[aria-current="page"] { color: var(--accent); }

/* ── cards ─────────────────────────────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
        padding: 22px 24px; margin-bottom: var(--gap); box-shadow: var(--shadow); }
/* The one figure a screen exists to show. */
.card.is-primary { border-color: var(--accent-line); box-shadow: var(--shadow-primary); }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.card-h h2 { font-size: var(--t-h2); line-height: 1.5; }
.card-h .ic { color: var(--ink-3); }
.card-h .tag { margin-left: auto; }
.card .sub { color: var(--ink-2); font-size: var(--t-body); line-height: 1.5;
             margin-bottom: var(--s2); max-width: 72ch; }
.grid { display: grid; gap: var(--gap); margin-bottom: var(--gap); }
.grid > .card, .grid > .tile { margin-bottom: 0; }
/* Measured against the content column, not the window: with the sidebar out
   the window is a third wider than the space these cards get. */
.grid > * { container-type: inline-size; min-width: 0; }
@container view (min-width: 720px) { .g2 { grid-template-columns: 1fr 1fr; } }
@container view (min-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } }
@container view (min-width: 780px) { .g3 { grid-template-columns: repeat(3, 1fr); } }
@container view (min-width: 940px) { .g4 { grid-template-columns: repeat(4, 1fr); } }
/* A chart with a narrower companion beside it (v3: 727 / 376). */
@container view (min-width: 900px) { .g-main { grid-template-columns: minmax(0,2fr) minmax(0,1fr); } }
/* The dashboard's lead row: the headline figure gets the widest cell. */
@container view (min-width: 900px) { .g-lead { grid-template-columns: 4fr 3fr 3fr; } }

/* ── stat tiles ────────────────────────────────────────────────────────── */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
        padding: 18px 20px; min-width: 0; }
.tile .tile-l, .tile .stat-l { font-size: var(--t-label); font-weight: 500; color: var(--ink-2);
                                margin-bottom: 6px; }
.tile .tile-v { font-size: var(--t-stat); font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.tile .tile-m { font-size: var(--t-label); color: var(--ink-2); margin-top: 8px; line-height: 1.5; }
.cur { font-size: 18px; font-weight: 500; color: var(--ink-num); margin-right: 4px;
       letter-spacing: 0; }
.tile .cur { font-size: var(--t-label); }

/* ── toolbar strip ─────────────────────────────────────────────────────── */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
           background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
           padding: 12px 20px; margin-bottom: var(--gap); }
.toolbar .tb-l { font-weight: 600; font-size: var(--t-body); }
.toolbar .tb-r { margin-left: auto; color: var(--ink-2); font-size: var(--t-label); }
.toolbar input[type=date] { width: auto; font-weight: 600; }
.chip { display: inline-flex; align-items: center; height: 30px; padding: 0 8px;
        border: 1px solid var(--line); border-radius: var(--r-chip); background: var(--surface);
        color: var(--ink-2); font-size: var(--t-label); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft);
                             color: var(--accent); }

/* ── figures ───────────────────────────────────────────────────────────── */
.fig { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.hero { font-size: var(--t-hero); font-weight: 650; letter-spacing: -1px; line-height: 1.05;
        color: var(--ink); }
.bigdate { font-size: var(--t-date); font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
@media (max-width: 560px) { .hero { font-size: 32px; } #top h1 { font-size: 20px; } }
.stat-v { font-size: var(--t-stat); font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.stat-v .cur { font-size: var(--t-label); }
.stat-l { font-size: var(--t-label); color: var(--ink-2); display: flex; align-items: center;
          gap: 7px; margin-bottom: 6px; font-weight: 500; line-height: 1.4; }
.stat-l .ic { color: var(--ink-3); }
.neg { color: var(--error); }

/* Unavailable is a state, never a number. */
.na { display: inline-flex; align-items: flex-start; gap: 6px; background: var(--warn-bg);
      border: 1px solid var(--warn-line); border-radius: var(--r-ctl); padding: 8px 10px;
      color: var(--warn); font-size: var(--t-meta); font-weight: 500; line-height: 1.45;
      max-width: 46ch; }
.na .ic { color: var(--warn); margin-top: 1px; }
.na b { display: block; font-weight: 600; }
.na span { font-weight: 400; }
.na-sm { padding: 5px 9px; font-size: var(--t-tag); }

/* provenance - a small dot says which kind before the word does */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-tag); font-weight: 500;
       padding: 3px 9px; border-radius: var(--r-ctl); background: var(--surface-sunk);
       border: 0; color: var(--ink-2); white-space: nowrap; line-height: 1.5; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none;
               background: var(--dot-neutral); }
.tag.is-actual, .tag.is-current, .tag.is-ok { background: var(--ok-bg); color: var(--accent); }
.tag.is-actual::before, .tag.is-current::before, .tag.is-ok::before { background: var(--dot-ok); }
.tag.is-forecast, .tag.is-warn { background: var(--warn-bg); color: var(--warn); }
.tag.is-forecast::before, .tag.is-warn::before { background: var(--warn-dot); }
.tag.is-assumed { background: var(--surface-sunk); color: var(--ink-2); }
.tag.is-error { background: var(--error-bg); color: var(--error); }
.tag.is-error::before { background: var(--error); }
.tag.nodot::before { display: none; }
/* The dot already says which kind; an icon beside it said it twice. */
.tag > .ic { display: none; }
button.tag { cursor: pointer; }
.meta { font-size: var(--t-meta); color: var(--ink-2); line-height: 1.5; }

/* ── notices ───────────────────────────────────────────────────────────── */
.note { display: flex; gap: 10px; border-radius: var(--r-banner); padding: 10px 12px;
        font-size: var(--t-label); margin: var(--s2) 0; border: 1px solid var(--line);
        background: var(--surface-alt); color: var(--ink-2); line-height: 1.5; }
.note .ic { flex: none; margin-top: 1px; }
.note.is-warn  { background: var(--warn-bg);  border-color: var(--warn-line);  color: var(--warn); }
.note.is-error { background: var(--error-bg); border-color: var(--error-line); color: var(--error); }
.note.is-ok    { background: var(--ok-bg);    border-color: var(--accent-line); color: var(--accent); }
.note b { font-weight: 600; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { margin: 3px 0; }
/* A notice standing on its own between cards, rather than inside one. */
#view > .note, .banner { margin: 0 0 var(--gap); align-items: center; }
.banner > div { flex: 1 1 auto; }
.banner .btn { margin-left: auto; }

/* ── tables ────────────────────────────────────────────────────────────── */
.tscroll { overflow-x: auto; margin: 0 -24px; padding: 0 24px;
           max-height: 620px; overflow-y: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--t-body); }
th, td { text-align: left; padding: 10px 14px; white-space: nowrap; line-height: 1.5;
         border-bottom: 1px solid var(--line-soft); }
thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-alt);
           font-size: var(--t-label); font-weight: 500; color: var(--ink-2);
           border-bottom: 1px solid var(--line); }
tbody tr:hover td { background: var(--surface-alt); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.n { font-weight: 500; }
tr.group td { font-weight: 600; background: var(--surface) !important; }
tr.child td:first-child { padding-left: 34px; color: var(--ink-2); font-weight: 400; }
tr.sum td { font-weight: 650; border-top: 1px solid var(--line); border-bottom: 0; }
td.wrap, th.wrap { white-space: normal; min-width: 240px; }
td.act, th.act { position: sticky; right: 0; background: var(--surface);
                 border-left: 1px solid var(--line-soft); text-align: right; }
tbody tr:hover td.act { background: var(--surface-alt); }
.expander { background: none; border: 0; padding: 0 6px 0 0; cursor: pointer; color: var(--ink-3);
            display: inline-flex; align-items: center; vertical-align: middle; }
.expander .ic { transition: transform .15s ease; }
.expander[aria-expanded="true"] .ic { transform: rotate(90deg); }

/* ── update bar ────────────────────────────────────────────────────────── */
/* Loud enough to be seen on the way past, quiet enough not to be the thing
   you look at first every single time. */
#updatebar:empty { display: none; }
.updbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px var(--pad-x); background: var(--ok-bg);
  border-bottom: 1px solid var(--accent-line); color: var(--accent);
  font-size: var(--t-label); }
.updbar.is-working { background: var(--warn-bg); border-bottom-color: var(--warn-line);
  color: var(--warn); }
.updbar b { font-weight: 600; }
.updbar .grow { flex: 1 1 auto; }
.updbar .btn { margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .updbar.is-ready { animation: updin .35s ease-out; }
}
@keyframes updin { from { opacity: 0; transform: translateY(-6px); } }

/* ── reporting range (custom dates only; presets live in the header) ─────── */
#rangebar:empty { display: none; }
.rangebar { background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-card); padding: 12px 20px; margin-bottom: var(--gap); }
.rangebar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.rangebar-l { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-body);
              font-weight: 600; color: var(--ink); white-space: nowrap; }
.range-seg { flex-wrap: wrap; }
.rangebar-d { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rangebar-d .lbl { margin: 0; white-space: nowrap; }
.rangebar-d input[type=date] { width: auto; }
/* Which dates a screen reads. Kept - it is what makes the figures honest - but
   as a footnote under the screen rather than a box above it. */
.datebasis { margin: var(--s2) 0 0; padding: 0; background: none; border: 0;
             display: flex; gap: 8px; align-items: flex-start; color: var(--ink-3); }
.datebasis .ic { margin-top: 3px; }
.datebasis b { color: var(--ink-2); font-weight: 600; }

/* ── readiness checklist ───────────────────────────────────────────────── */
.checklist { display: grid; gap: 0; margin-top: 8px; }
.ck { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px;
      align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.ck:last-child { border-bottom: 0; }
.ck-i { color: var(--warn); display: flex; }
.ck .meta { margin-top: 2px; }
.ck-a { text-align: right; }
@container (max-width: 520px) {
  .ck { grid-template-columns: auto minmax(0,1fr); }
  .ck-a { grid-column: 2; text-align: left; }
}

/* ── bridge list ───────────────────────────────────────────────────────── */
.bridge { list-style: none; margin: 0; padding: 0; font-size: var(--t-body); }
.bridge li { display: flex; gap: var(--s2); padding: 9px 0; border-bottom: 1px solid var(--line-soft);
             align-items: baseline; }
.bridge li .l { flex: 1; color: var(--ink-2); }
.bridge li .v { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.bridge li.total { border-bottom: 0; border-top: 1px solid var(--line); margin-top: 4px; }
.bridge li.total .l, .bridge li.total .v { color: var(--ink); font-weight: 650; font-size: 17px; }
.bridge li.ctx { border-bottom: 0; color: var(--ink-3); font-size: var(--t-meta); }

/* ── controls ──────────────────────────────────────────────────────────── */
label.lbl { display: block; font-size: var(--t-label); color: var(--ink-2); margin-bottom: 6px;
            font-weight: 500; }
input[type=date], input[type=text], input[type=number], input[type=password], input[type=url],
select, textarea {
  font-size: var(--t-label); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl); padding: 0 10px; min-height: 36px;
  width: 100%; transition: border-color .15s ease, box-shadow .15s ease; }
textarea { padding: 8px 10px; }
select { padding: 0 6px; }
input:hover, select:hover { border-color: var(--ink-3); }
input:focus, select:focus, textarea:focus { border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.field { margin-bottom: var(--s2); }
.frow { display: grid; gap: var(--s2); }
@media (min-width: 640px) { .frow.f2 { grid-template-columns: 1fr 1fr; }
                            .frow.f3 { grid-template-columns: repeat(3,1fr); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
       min-height: 36px; background: var(--accent); color: var(--accent-ink);
       border: 1px solid transparent; border-radius: var(--r-ctl); padding: 0 12px;
       font-weight: 600; font-size: var(--t-label); cursor: pointer; white-space: nowrap;
       transition: background-color .15s ease, border-color .15s ease; }
.btn:hover { background: var(--accent-hover); }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line-2); font-weight: 500; }
.btn.sec:hover { background: var(--surface-alt); border-color: var(--ink-3); }
.btn.warn { background: var(--surface); color: var(--warn); border-color: var(--warn-dot); font-weight: 500; }
.btn.warn:hover { background: var(--warn-bg); }
.btn.danger { background: var(--error); color: var(--surface); border-color: transparent; }
.btn.danger:hover { background: #991B1B; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: var(--t-label); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; gap: var(--s1); flex-wrap: wrap; align-items: center; }
/* Segmented filter: a sunk track, the chosen option lifted out of it. */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-nav);
       background: var(--surface-sunk); flex-wrap: wrap; }
.seg button { background: none; border: 0; min-height: 30px; padding: 0 10px; font-size: var(--t-label);
              font-weight: 500; color: var(--ink-2); cursor: pointer; border-radius: var(--r-chip); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-current="true"] {

details { border: 1px solid var(--line-soft); border-radius: var(--r-banner); padding: 10px 12px;
          margin: var(--s1) 0; background: var(--surface-alt); }
/* A whole section folded away (v3 "Calculations and assumptions"). */

/* "Show as table" under a chart: a link, not a box. */
details.plain { border: 0; padding: 0; background: none; margin: 12px 0 0; }

.tag[title] { cursor: help; }

/* Label flexes, value hugs its content - otherwise a long "Unavailable, needs…"

.dl { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: var(--t-body);

}

/* ── charts ────────────────────────────────────────────────────────────── */
/* Drawn at their natural pixel size and never stretched past it (each SVG
