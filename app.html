<title>Your Amazon Cash Outlook</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── palette ──────────────────────────────────────────────────────────────
   A committed light theme, to the supplied specification. Every surface is
   painted explicitly so the page holds its own ground whatever theme the host
   renders in.

   Chart marks use teal #0D9488 rather than the UI accent #0F766E: the accent
   sits just below the chroma floor for a data mark and reads grey against the
   surface. Same hue family, one step brighter, validated. */
:root {
  --page:        #F6F7F9;
  --surface:     #FFFFFF;
  --surface-alt: #FAFBFC;
  --ink:         #172B4D;
  --ink-2:       #48546B;   /* 7.6:1 on surface — was #596579, 4.9:1 */
  --ink-3:       #5E6B80;   /* 5.3:1 on surface — was #8793A6, 3.1:1 and failing AA */
  --accent:      #0F766E;
  --accent-ink:  #FFFFFF;
  --accent-soft: #E8F5F1;
  --line:        #E2E8F0;
  --line-2:      #CBD5E1;
  --warn:        #92400E;
  --warn-bg:     #FFFBEB;
  --warn-line:   #FDE68A;
  --error:       #B91C1C;
  --error-bg:    #FEF2F2;
  --error-line:  #FECACA;
  --ok:          #0F766E;
  --ok-bg:       #E8F5F1;

  /* data marks — validated as a categorical pair */
  --mark-1:      #0D9488;
  --mark-1-soft: #CCFBF1;
  --mark-2:      #B45309;
  --mark-2-soft: #FEF3C7;
  --mark-grid:   #EDF1F6;
  --mark-neutral:#94A3B8;

  /* Claude assistant panel */
  --claude:      #D97757;
  --claude-bg:   #FDF8F4;
  --claude-line: #F0DDD1;

  --r-card: 14px;
  --r-ctl: 8px;
  --shadow: 0 1px 2px rgba(23,43,77,.04), 0 2px 8px rgba(23,43,77,.05);
  --shadow-lift: 0 2px 4px rgba(23,43,77,.06), 0 8px 24px rgba(23,43,77,.08);
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  /* 8px spacing grid */
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;

  /* Type scale. Body and table text sit at 16px so the app is comfortable
     at 100% browser zoom; nothing that carries meaning goes below 13px. */
  --t-hero:  44px;
  --t-stat:  30px;
  --t-h1:    28px;
  --t-h2:    19px;
  --t-h3:    17px;
  --t-body:  16px;
  --t-label: 15px;
  --t-meta:  14.5px;
  --t-tag:   13.5px;
  --lh-body: 1.6;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans);
       font-size: var(--t-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased;
       font-feature-settings: "cv05" 1; }
h1,h2,h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; color: var(--ink); }
p { margin: 0 0 var(--s1); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── shell ─────────────────────────────────────────────────────────────── */
#shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
#side { display: none; }
#main { min-width: 0; padding: 0 var(--s2) 96px; }
.wrap { max-width: 1180px; margin: 0 auto; }
#view { container-type: inline-size; container-name: view; }

/* ── icons ─────────────────────────────────────────────────────────────── */
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
      stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; stroke-width: 2; }
.ic-lg { width: 24px; height: 24px; }

/* ── top bar ───────────────────────────────────────────────────────────── */
#top { background: var(--surface); border-bottom: 1px solid var(--line);
       margin: 0 calc(var(--s2) * -1) var(--s3); padding: var(--s2); }
#top .inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap;
              align-items: center; gap: var(--s2); }
#top h1 { font-size: var(--t-h1); line-height: 1.2; letter-spacing: -.02em; }
#top #pageblurb { font-size: var(--t-body); color: var(--ink-2); line-height: 1.5;
                  margin: 6px 0 0; max-width: 68ch; }
#top .asof { font-size: var(--t-meta); color: var(--ink-2); display: flex; align-items: center; gap: 6px;
             margin-top: 8px; }
#top .spacer { flex: 1 1 auto; }
#top .controls { display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; }

/* ── mobile nav ────────────────────────────────────────────────────────── */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex;
          background: var(--surface); border-top: 1px solid var(--line);
          padding-bottom: env(safe-area-inset-bottom);
          overflow-x: auto; scrollbar-width: none; }
#tabbar::-webkit-scrollbar { display: none; }
#tabbar button { flex: 1 0 auto; min-width: 62px; background: none; border: 0; color: var(--ink-2);
                 padding: 10px 8px 8px; font-size: 12.5px; font-weight: 500; cursor: pointer;
                 display: flex; flex-direction: column; align-items: center; gap: 4px;
                 white-space: nowrap; }
#tabbar button[aria-current="page"] { color: var(--accent); }

/* ── cards ─────────────────────────────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
        padding: var(--s3) var(--s3) var(--s4); margin-bottom: var(--s3);
        box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.card-h h2 { font-size: var(--t-h2); line-height: 1.3; }
.card-h .ic { color: var(--ink-2); }
.card .sub { color: var(--ink-2); font-size: var(--t-body); line-height: 1.55;
             margin-bottom: var(--s2); max-width: 70ch; }
.grid { display: grid; gap: var(--s2); }
/* Measured against the content column, not the window: with the sidebar out
   at >=1000px the window is a third wider than the space these cards get, and
   a viewport breakpoint was packing four figures into 158px each. */
/* Grid children are containers themselves, so anything inside one measures
   the column it actually sits in rather than the whole page. */
.grid > * { container-type: inline-size; }
@container view (min-width: 720px) { .g2 { grid-template-columns: 1fr 1fr; } }
@container view (min-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } }
@container view (min-width: 780px) { .g3 { grid-template-columns: repeat(3, 1fr); } }
@container view (min-width: 940px) { .g4 { grid-template-columns: repeat(4, 1fr); } }

/* ── figures ───────────────────────────────────────────────────────────── */
.fig { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.hero { font-size: var(--t-hero); font-weight: 700; letter-spacing: -.03em; line-height: 1.08;
        color: var(--ink); }
@media (max-width: 560px) { .hero { font-size: 34px; }
                            #top h1 { font-size: 24px; } }
.stat-v { font-size: var(--t-stat); font-weight: 650; letter-spacing: -.022em; line-height: 1.15; }
.stat-l { font-size: var(--t-label); color: var(--ink-2); display: flex; align-items: center;
          gap: 7px; margin-bottom: 8px; font-weight: 500; line-height: 1.35; }
.stat-l .ic { color: var(--ink-3); }
.neg { color: var(--error); }

/* Unavailable is a state, never a number. */
.na { display: inline-flex; align-items: flex-start; gap: 6px; background: var(--warn-bg);
      border: 1px solid var(--warn-line); border-radius: var(--r-ctl); padding: 8px 10px;
      color: var(--warn); font-size: var(--t-meta); font-weight: 500; line-height: 1.45;
      max-width: 46ch; }
.na .ic { color: var(--warn); margin-top: 1px; }
.na b { display: block; font-weight: 600; }
.na span { font-weight: 400; }
.na-sm { padding: 5px 9px; font-size: var(--t-tag); }

/* provenance */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-tag); font-weight: 600;
       padding: 3px 9px; border-radius: 999px; background: var(--surface-alt);
       border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.is-actual  { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.is-current { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.is-forecast{ background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.tag.is-assumed { background: var(--surface-alt); color: var(--ink-2); }
.meta { font-size: var(--t-meta); color: var(--ink-2); line-height: 1.55; }

/* ── notices ───────────────────────────────────────────────────────────── */
.note { display: flex; gap: 10px; border-radius: var(--r-ctl); padding: 12px 14px;
        font-size: 15.5px; margin: var(--s2) 0; border: 1px solid var(--line);
        background: var(--surface-alt); color: var(--ink-2); line-height: 1.6; }
.note .ic { flex: none; margin-top: 1px; }
.note.is-warn  { background: var(--warn-bg);  border-color: var(--warn-line);  color: var(--warn); }
.note.is-error { background: var(--error-bg); border-color: var(--error-line); color: var(--error); }
.note.is-ok    { background: var(--ok-bg);    border-color: transparent;       color: var(--accent); }
.note b { font-weight: 600; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { margin: 3px 0; }

/* ── tables ────────────────────────────────────────────────────────────── */
.tscroll { overflow-x: auto; margin: 0 calc(var(--s3) * -1); padding: 0 var(--s3);
           max-height: 620px; overflow-y: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--t-body); }
th, td { text-align: left; padding: 14px 16px; white-space: nowrap; line-height: 1.45;
         border-bottom: 1px solid var(--line); }
thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-alt);
           font-size: var(--t-label); font-weight: 600; color: var(--ink-2);
           border-bottom: 1px solid var(--line-2); }
tbody tr:nth-child(even) td { background: var(--surface-alt); }
tbody tr:hover td { background: var(--accent-soft); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.group td { font-weight: 600; background: var(--surface) !important; }
tr.child td:first-child { padding-left: 34px; color: var(--ink-2); font-weight: 400; }
tr.sum td { font-weight: 650; border-top: 1px solid var(--line-2); }
td.wrap, th.wrap { white-space: normal; min-width: 240px; }
td.act, th.act { position: sticky; right: 0; background: var(--surface);
                 border-left: 1px solid var(--line); text-align: right; }
tbody tr:nth-child(even) td.act { background: var(--surface-alt); }
tbody tr:hover td.act { background: var(--accent-soft); }
.expander { background: none; border: 0; padding: 0 6px 0 0; cursor: pointer; color: var(--ink-3);
            display: inline-flex; align-items: center; vertical-align: middle; }
.expander .ic { transition: transform .15s ease; }
.expander[aria-expanded="true"] .ic { transform: rotate(90deg); }

/* ── global reporting range ────────────────────────────────────────────── */
/* The update bar. Loud enough to be seen on the way past, quiet enough not
   to be the thing you look at first every single time. */
#updatebar:empty { display: none; }
.updbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--ok-bg, #e7f5ef);
  border-bottom: 1px solid var(--ok-line, #bfe3d3); color: var(--ok-ink, #14543c);
  font-size: var(--t-label); }
.updbar.is-working { background: var(--warn-bg, #fdf3e0);
  border-bottom-color: var(--warn-line, #f0d9ab); color: var(--warn-ink, #6b4c12); }
.updbar b { font-weight: 650; }
.updbar .grow { flex: 1 1 auto; }
.updbar .btn { margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .updbar.is-ready { animation: updin .35s ease-out; }
}
@keyframes updin { from { opacity: 0; transform: translateY(-6px); } }

.rangebar { background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-card); padding: 14px var(--s3); margin-bottom: var(--s3);
            box-shadow: var(--shadow); }
.rangebar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px var(--s2); }
.rangebar-l { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-label);
              font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.range-seg { flex-wrap: wrap; }
.rangebar-d { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rangebar-d .lbl { margin: 0; white-space: nowrap; }
.rangebar-d input[type=date] { width: auto; }
.datebasis { margin: 0 0 var(--s3); padding: 12px 14px; background: var(--surface-alt);
             border: 1px solid var(--line); border-radius: var(--r-ctl); }
.datebasis b { color: var(--ink); font-weight: 600; }

/* ── readiness checklist ───────────────────────────────────────────────── */
.checklist { display: grid; gap: 2px; margin-top: var(--s2); }
.ck { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px;
      align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ck:last-child { border-bottom: 0; }
.ck-i { color: var(--warn); display: flex; }
.ck .meta { margin-top: 2px; }
.ck-a { text-align: right; }
@container (max-width: 520px) {
  .ck { grid-template-columns: auto minmax(0,1fr); }
  .ck-a { grid-column: 2; text-align: left; }
}

/* ── bridge list ───────────────────────────────────────────────────────── */
.bridge { list-style: none; margin: 0; padding: 0; font-size: var(--t-body); }
.bridge li { display: flex; gap: var(--s2); padding: 13px 0; border-bottom: 1px solid var(--line);
             align-items: baseline; }
.bridge li .l { flex: 1; color: var(--ink-2); }
.bridge li .v { font-variant-numeric: tabular-nums; font-weight: 550; text-align: right; }
.bridge li.total { border-bottom: 0; border-top: 2px solid var(--line-2); margin-top: 4px; }
.bridge li.total .l, .bridge li.total .v { color: var(--ink); font-weight: 700; font-size: 17px; }
.bridge li.ctx { border-bottom: 0; color: var(--ink-3); font-size: var(--t-meta); }

/* ── controls ──────────────────────────────────────────────────────────── */
label.lbl { display: block; font-size: var(--t-label); color: var(--ink-2); margin-bottom: 7px;
            font-weight: 500; }
input[type=date], input[type=text], input[type=number], select, textarea {
  font-size: var(--t-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl); padding: 9px 11px; width: 100%;
  transition: border-color .15s ease, box-shadow .15s ease; }
input:hover, select:hover { border-color: var(--ink-3); }
input:focus, select:focus, textarea:focus { border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.field { margin-bottom: var(--s2); }
.frow { display: grid; gap: var(--s2); }
@media (min-width: 640px) { .frow.f2 { grid-template-columns: 1fr 1fr; }
                            .frow.f3 { grid-template-columns: repeat(3,1fr); } }
.btn { display: inline-flex; align-items: center; gap: 7px; background: var(--accent);
       color: var(--accent-ink); border: 1px solid transparent; border-radius: var(--r-ctl);
       padding: 11px 18px; font-weight: 600; font-size: 15.5px; cursor: pointer;
       transition: filter .15s ease, box-shadow .15s ease; }
.btn:hover { filter: brightness(1.08); box-shadow: var(--shadow); }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn.sec:hover { background: var(--surface-alt); filter: none; border-color: var(--ink-3); }
.btn.danger { background: var(--error); color: var(--surface); border-color: transparent; }
.btn.danger:hover { background: var(--error); filter: brightness(1.08); }
.btn.sm { padding: 8px 13px; font-size: var(--t-meta); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; gap: var(--s1); flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-ctl);
       overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 10px 16px; font-size: var(--t-label); font-weight: 500;
              color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: var(--s2);
           border-bottom: 1px solid var(--line); }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent;
                  color: var(--ink-2); padding: 11px 16px; font-size: 15.5px; font-weight: 600;
                  cursor: pointer; }
.subtabs button:hover { color: var(--ink); }
.subtabs button[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }

details { border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 12px 14px;
          margin: var(--s1) 0; background: var(--surface-alt); }
.tag[title] { cursor: help; }
.legend-d { margin-top: var(--s2); }
.legend-d .dl dt { display: flex; align-items: center; }
summary { cursor: pointer; font-size: 15.5px; font-weight: 600; color: var(--ink-2);
          display: flex; align-items: center; gap: 7px; }
summary::-webkit-details-marker { display: none; }
summary .ic { color: var(--ink-3); }
details[open] > summary { margin-bottom: 10px; }

/* Label flexes, value hugs its content — otherwise a long "Unavailable, needs…"
   is squeezed into a one-word-per-line column. */
.dl { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: var(--t-body);
      align-items: baseline; }
.dl dt { padding-top: 10px; }
.dl dd { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.dl dd:last-child { border-bottom: 0; }
@container (min-width: 420px) {
  .dl { grid-template-columns: minmax(0,1fr) minmax(0,auto); gap: 0 var(--s2); }
  .dl dt { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dl dd { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dl dt:last-of-type, .dl dd:last-child { border-bottom: 0; }
}
.dl dt { color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.dl dt .ic { color: var(--ink-3); }
.dl dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.dl dd .na { text-align: left; min-width: 0; max-width: 100%; }

.empty { text-align: center; padding: var(--s5) var(--s2); color: var(--ink-2); }
.empty .ic { color: var(--ink-3); width: 32px; height: 32px; margin-bottom: 10px; }
.empty h3 { font-size: 20px; margin-bottom: 8px; }
.empty p { font-size: var(--t-body); line-height: 1.55; max-width: 48ch; margin: 0 auto var(--s2); }

/* ── drop zone ─────────────────────────────────────────────────────────── */
#drop { border: 2px dashed var(--line-2); border-radius: var(--r-card); padding: var(--s5) var(--s3);
        text-align: center; color: var(--ink-2); background: var(--surface-alt);
        transition: border-color .15s ease, background .15s ease; }
#drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop .ic { color: var(--ink-3); width: 30px; height: 30px; }
#drop h3 { font-size: 20px; margin: var(--s1) 0 6px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden;
       margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0;
         transition: width .25s ease; }

/* ── charts ────────────────────────────────────────────────────────────── */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--sans); font-variant-numeric: tabular-nums; }
.ch-axis { font-size: 13px; fill: var(--ink-2); }
.ch-val  { font-size: var(--t-tag); fill: var(--ink); font-weight: 600; }
.ch-grid { stroke: var(--mark-grid); stroke-width: 1; }
.ch-base { stroke: var(--line-2); stroke-width: 1; }
.ch-bar { transition: opacity .15s ease; }
.ch-bar:hover { opacity: .78; }
.legend { display: flex; gap: var(--s2); flex-wrap: wrap; font-size: var(--t-meta); color: var(--ink-2);
          margin-top: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.key { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.key.solid { background: var(--mark-1); }
.key.fc { background: var(--mark-1-soft); border: 1px dashed var(--mark-1); }
.key.neg { background: var(--mark-2); }

/* ── Ask Claude ────────────────────────────────────────────────────────── */
#askbtn { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--claude-bg);
          border: 1px solid var(--claude-line); border-radius: var(--r-ctl); padding: 11px 12px;
          color: var(--ink); font-size: 15.5px; font-weight: 600; cursor: pointer;
          transition: box-shadow .15s ease; }
#askbtn:hover { box-shadow: var(--shadow); }
#askbtn .star { color: var(--claude); width: 20px; height: 20px; flex: none; }
#ask { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 60;
       background: var(--claude-bg); border-left: 1px solid var(--claude-line);
       box-shadow: var(--shadow-lift); display: flex; flex-direction: column;
       transform: translateX(100%); transition: transform .22s ease; }
#ask[data-open="true"] { transform: translateX(0); }
#ask header { display: flex; align-items: center; gap: 10px; padding: var(--s2);
              border-bottom: 1px solid var(--claude-line); }
#ask header h2 { font-size: var(--t-h2); flex: 1; }
