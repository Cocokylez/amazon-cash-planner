<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="light dark">
<title>Ledger</title>
<style>
  /* Ledger's own colours, light and dark, so the first thing seen and the
     thing it opens into are plainly the same program. The window has no
     title bar of its own: it is dragged by its background, and Windows'
     close button sits in the top right corner. */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#F5F5F7, #161618);
    --text-1: light-dark(#1D1D1F, #F5F5F7);
    --text-2: light-dark(#56565B, #AEAEB2);
    --accent: #0071E3;
    --accent-hover: light-dark(#0062C4, #1A7FEA);
    --fill: light-dark(rgba(118,118,128,.12), rgba(118,118,128,.24));
    --warning: light-dark(#A05A00, #FFB340);
    --warning-tint: light-dark(#FFF4E0, #3A2A10);
    --positive: light-dark(#1E7B34, #30D158);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text-1); font: 400 13px/18px var(--font);
    display: flex; align-items: center; justify-content: center; padding: 40px 32px 28px;
    box-sizing: border-box; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-app-region: drag; cursor: default;
  }
  .card { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center;
          text-align: center; gap: 0; }
  .app-icon { width: 64px; height: 64px; border-radius: 15px; display: grid; place-items: center;
              background: linear-gradient(180deg, #2B8CFF, #0066D6);
              box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12), 0 6px 18px rgba(0,60,140,.28), 0 1px 2px rgba(0,60,140,.25); }
  .app-icon svg { width: 40px; height: 40px; }
  .working .app-icon { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  h1 { margin: 14px 0 2px; font: 700 22px/28px var(--font); letter-spacing: -0.4px; }
  .sub { margin: 0; color: var(--text-2); }

  .progress { width: 180px; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden;
              margin: 22px 0 12px; }
  .progress i { display: block; width: 30%; height: 100%; border-radius: 2px; background: var(--accent);
                animation: indet 1.4s cubic-bezier(.2,0,0,1) infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  /* Motion says "still going". Once it has stopped going, it stops moving -
     a spinner over a failure reads as progress that is still being made. */
  .ready .progress i { animation: none; width: 100%; background: var(--positive); }
  .stopped .progress { display: none; }

  .msg { min-height: 36px; color: var(--text-2); max-width: 360px; text-wrap: pretty; }
  .stopped .msg { margin-top: 20px; background: var(--warning-tint); color: var(--text-1);
                  padding: 10px 12px; border-radius: 12px; text-align: left; }

  .btnrow { margin-top: 14px; display: none; }
  .btnrow.show { display: block; }
  button {
    -webkit-app-region: no-drag; font: 600 13px/18px var(--font); height: 32px; padding: 0 16px;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px; cursor: default;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .45; }
  @media (prefers-reduced-motion: reduce) {
    .working .app-icon, .progress i { animation: none; }
  }
</style>
</head>
<body>
  <div class="card working" id="card" role="status" aria-live="polite">
    <span class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14" opacity=".55"/><path d="M5 12h14" opacity=".55"/><path d="M5 17h14" opacity=".55"/>
        <path d="M5 16.5 10 12l3 2.5L19 8"/>
      </svg>
    </span>
    <h1>Ledger</h1>
    <p class="sub">Amazon&#8217;s forecast of your sales and fees</p>
    <div class="progress" aria-hidden="true"><i></i></div>
    <div class="msg" id="msg">Starting&#8230;</div>
    <div class="btnrow" id="btnrow"><button id="act" type="button"></button></div>
  </div>

<script>
  var card = document.getElementById('card');
  var msg = document.getElementById('msg');
  var row = document.getElementById('btnrow');
  var act = document.getElementById('act');
  var pending = null;

  function apply(s) {
    if (!s) return;
    msg.textContent = s.text;
    card.className = 'card ' + s.kind;
    pending = s.action;
    if (pending && pending.label) {
      act.textContent = pending.label;
      act.disabled = false;
      row.className = 'btnrow show';
    } else {
      row.className = 'btnrow';
    }
  }

  /* Whatever was said before this page could listen. */
  if (window.shellStatus && window.shellStatus.current) {
    window.shellStatus.current().then(apply).catch(function () {});
  }

  /* One way of showing a status, used by both the catch-up and the live
     feed. Two copies of this drifted apart the moment one was edited. */
  if (window.shellStatus) {
    window.shellStatus.on(apply);
  }

  act.addEventListener('click', function () {
    if (!pending || !window.shellStatus) return;
    act.disabled = true;          /* one click is one action */
    if (pending.kind === 'run-setup') window.shellStatus.runSetup();
    else if (pending.kind === 'open-python') window.shellStatus.openPython();
    else if (pending.kind === 'open-releases') window.shellStatus.openReleases();
  });
</script>
</body>
</html>
