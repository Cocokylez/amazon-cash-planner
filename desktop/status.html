<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Amazon Cash Planner</title>
<style>
  /* The app's own colours, so the first thing seen and the thing it opens
     into do not look like two different programs. */
  :root {
    --page: #F6F7F9; --surface: #FFFFFF; --ink: #172B4D; --muted: #5E6C84;
    --accent: #0F766E; --line: #E2E8F0;
    --warn: #92400E; --warn-bg: #FFFBEB; --warn-line: #FDE68A;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink); font-family: var(--sans);
    display: flex; align-items: center; justify-content: center; padding: 28px;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 26px; width: 100%; max-width: 430px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
  .line { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
         margin-top: 5px; flex: 0 0 auto; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  /* Motion says "still going". Once it has stopped going, it stops moving —
     a spinner over a failure reads as progress that is still being made. */
  .ready .dot, .stopped .dot { animation: none; }
  .stopped .dot { background: var(--warn); }

  .stopped .msg { background: var(--warn-bg); border: 1px solid var(--warn-line);
                  color: var(--warn); padding: 10px 12px; border-radius: 8px; }
  .msg { min-height: 42px; }

  .btnrow { margin-top: 14px; display: none; }
  .btnrow.show { display: block; }
  button {
    font: inherit; font-weight: 600; font-size: 13px;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 16px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.55; cursor: default; filter: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Amazon Cash Planner</h1>
    <p class="sub">Your reports stay on this computer.</p>
    <div class="line"><span class="dot"></span><span class="msg" id="msg">Starting&#8230;</span></div>
    <div class="btnrow" id="btnrow"><button id="act" type="button"></button></div>
  </div>

<script>
  var card = document.getElementById('card');
  var msg = document.getElementById('msg');
  var row = document.getElementById('btnrow');
  var act = document.getElementById('act');
  var pending = null;

  function apply(s) {
    if (!s) return;
    msg.textContent = s.text;
    card.className = 'card ' + s.kind;
    pending = s.action;
    if (pending && pending.label) {
      act.textContent = pending.label;
      act.disabled = false;
      row.className = 'btnrow show';
    } else {
      row.className = 'btnrow';
    }
  }

  /* Whatever was said before this page could listen. */
  if (window.shellStatus && window.shellStatus.current) {
    window.shellStatus.current().then(apply).catch(function () {});
  }

  /* One way of showing a status, used by both the catch-up and the live
     feed. Two copies of this drifted apart the moment one was edited. */
  if (window.shellStatus) {
    window.shellStatus.on(apply);
  }

  act.addEventListener('click', function () {
    if (!pending || !window.shellStatus) return;
    act.disabled = true;          /* one click is one action */
    if (pending.kind === 'run-setup') window.shellStatus.runSetup();
    else if (pending.kind === 'open-python') window.shellStatus.openPython();
  });
</script>
</body>
</html>
